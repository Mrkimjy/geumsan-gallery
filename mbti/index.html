<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>간단 MBTI 검사 · PeConnecton</title>
<meta name="description" content="12문항으로 보는 간단 MBTI 성향 검사. 재미로 해보는 콘텐츠입니다.">
<meta name="robots" content="index, follow">
<style>
  :root { --bg:#0A0A0A; --card:#141414; --line:#262626; --fg:#F2F2F2; --sub:#A3A3A3; --accent:#FC6A10; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { padding: 0 16px; padding-block: 24px 60px; line-height: 1.6; }
  .wrap { max-width: 560px; margin: 0 auto; }
  a.back { color: var(--sub); text-decoration: none; font-size: 13px; }
  a.back:hover { color: var(--accent); }
  h1 { font-size: 28px; font-weight: 800; margin: 18px 0 6px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--sub); font-size: 14px; margin-bottom: 22px; word-break: keep-all; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 16px; }
  .btn { width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--sub); }
  .prog { height: 6px; background: #1E1E1E; border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
  .prog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .count { font-size: 12px; color: var(--sub); margin-bottom: 18px; }
  .q { font-size: 19px; font-weight: 700; line-height: 1.5; min-height: 84px; word-break: keep-all; margin-bottom: 18px; }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .scale button { background: #0E0E0E; border: 1px solid var(--line); color: var(--fg); border-radius: 12px; padding: 14px 0; font-size: 13px; cursor: pointer; font-family: inherit; }
  .scale button:hover, .scale button.on { border-color: var(--accent); color: var(--accent); }
  .scale-lbl { display: flex; justify-content: space-between; font-size: 12px; color: #A3A3A3; margin-top: 8px; }
  .nav { display: flex; gap: 8px; margin-top: 20px; }
  .nav .btn { flex: 1; }
  .type { font-size: 56px; font-weight: 900; color: var(--accent); letter-spacing: .04em; text-align: center; margin: 8px 0 4px; }
  .nick { text-align: center; font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .kw { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 16px; }
  .tag { font-size: 12px; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 3px 10px; }
  .desc { font-size: 15px; color: #d8d8d8; word-break: keep-all; text-align: center; }
  .axes { margin-top: 18px; }
  .axis { display: grid; grid-template-columns: 34px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; color: var(--sub); margin: 8px 0; }
  .axis .track { position: relative; height: 8px; background: #1E1E1E; border-radius: 999px; }
  .axis .dot { position: absolute; top: -3px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); transform: translateX(-50%); }
  .axis .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #444; }
  .note { font-size: 12px; color: #A3A3A3; line-height: 1.6; margin-top: 14px; word-break: keep-all; text-align: center; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← PeConnecton으로 돌아가기</a>
  <h1>간단 <span>MBTI</span> 검사</h1>
  <div class="sub">12개 문항으로 나의 성향 네 가지를 알아봅니다. 편하게 직관으로 골라 주세요.</div>

  <!-- 시작 -->
  <div class="card" id="intro">
    <div class="desc" style="margin-bottom:18px">각 문항을 읽고 "매우 아니다"부터 "매우 그렇다"까지 골라 주세요. 정답은 없고, 평소의 나에 가까운 쪽이 답입니다. 약 2분 정도 걸려요.</div>
    <button class="btn" id="startBtn">검사 시작</button>
  </div>

  <!-- 문항 -->
  <div class="card hidden" id="quiz">
    <div class="prog"><i id="bar" style="width:0%"></i></div>
    <div class="count" id="cnt"></div>
    <div class="q" id="qText"></div>
    <div class="scale" id="scale">
      <button data-v="1">매우<br>아니다</button>
      <button data-v="2">아니다</button>
      <button data-v="3">보통</button>
      <button data-v="4">그렇다</button>
      <button data-v="5">매우<br>그렇다</button>
    </div>
    <div class="nav">
      <button class="btn ghost" id="prevBtn" style="flex:0 0 96px">이전</button>
    </div>
  </div>

  <!-- 결과 -->
  <div class="card hidden" id="result">
    <div class="type" id="rType"></div>
    <div class="nick" id="rNick"></div>
    <div class="kw" id="rKw"></div>
    <div class="desc" id="rDesc"></div>
    <div class="axes" id="rAxes"></div>
    <div style="margin-top:20px"><button class="btn ghost" id="retryBtn">다시 검사하기</button></div>
    <div class="note">※ 재미로 해보는 간단 검사이며 전문 심리검사가 아닙니다. 결과는 참고만 해 주세요.</div>
  </div>
</div>

<script>
// 문항: d = 차원(EI, SN, TF, JP), l = 문항이 지지하는 글자
const QUESTIONS = [
  {t:'사람들과 어울리면 에너지가 충전된다.', d:'EI', l:'E'},
  {t:'모임에서 먼저 말을 거는 편이다.', d:'EI', l:'E'},
  {t:'혼자만의 시간이 있어야 마음이 편하다.', d:'EI', l:'I'},
  {t:'눈에 보이는 사실과 구체적인 경험을 믿는다.', d:'SN', l:'S'},
  {t:'새로운 아이디어보다 검증된 방법이 편하다.', d:'SN', l:'S'},
  {t:'"만약에…"를 상상하는 게 즐겁다.', d:'SN', l:'N'},
  {t:'결정할 때 논리와 객관적 기준을 우선한다.', d:'TF', l:'T'},
  {t:'관계가 조금 불편해져도 솔직한 말이 필요하다고 본다.', d:'TF', l:'T'},
  {t:'상대의 감정을 먼저 헤아리는 편이다.', d:'TF', l:'F'},
  {t:'계획을 세우고 그대로 실행하는 게 편하다.', d:'JP', l:'J'},
  {t:'마감 전에 미리 끝내 두는 편이다.', d:'JP', l:'J'},
  {t:'상황에 따라 계획을 유연하게 바꾸는 게 좋다.', d:'JP', l:'P'}
];
// 16유형 — 짧은 별명, 키워드, 한 줄 풀이 (재미용)
const TYPES = {
  INTJ:{n:'전략가', k:['계획','통찰','독립'], d:'머릿속에 큰 그림을 그리고 조용히 실행하는 타입. 목표가 분명하면 누구보다 끈기 있게 밀고 갑니다.'},
  INTP:{n:'논리술사', k:['호기심','분석','아이디어'], d:'생각의 구조를 끝까지 파고드는 탐구형. 새로운 이론과 질문을 즐기고, 자유로운 사고를 중시합니다.'},
  ENTJ:{n:'통솔자', k:['리더십','추진력','결단'], d:'목표를 세우고 사람과 자원을 움직이는 타입. 효율을 중시하고, 큰 일을 맡을 때 힘을 냅니다.'},
  ENTP:{n:'변론가', k:['재치','토론','도전'], d:'새로운 가능성을 찾아 토론을 즐기는 타입. 틀에 얽매이지 않고 사람들에게 영감을 줍니다.'},
  INFJ:{n:'옹호자', k:['통찰','신념','배려'], d:'사람의 속마음과 방향을 깊이 읽는 타입. 조용하지만 한번 믿은 가치는 끝까지 지킵니다.'},
  INFP:{n:'중재자', k:['공감','이상','진정성'], d:'자기만의 가치관이 뚜렷하고 사람을 따뜻하게 대하는 타입. 의미 있는 일에 깊이 몰입합니다.'},
  ENFJ:{n:'선도자', k:['소통','영감','책임'], d:'사람을 성장시키고 함께 움직이게 하는 타입. 분위기를 살피며 모두가 편하도록 이끕니다.'},
  ENFP:{n:'활동가', k:['열정','상상력','사교'], d:'가능성과 사람에게서 에너지를 얻는 타입. 새로운 시작을 좋아하고 주변을 밝게 만듭니다.'},
  ISTJ:{n:'현실주의자', k:['성실','원칙','신뢰'], d:'맡은 일은 정확하고 책임감 있게 끝내는 타입. 검증된 방식과 약속을 소중히 여깁니다.'},
  ISFJ:{n:'수호자', k:['헌신','배려','꼼꼼'], d:'주변 사람을 세심하게 챙기는 타입. 조용히 뒤에서 도와주며 안정감을 줍니다.'},
  ESTJ:{n:'경영자', k:['체계','실행','질서'], d:'규칙과 체계를 세우고 일을 확실히 진행하는 타입. 현실적이고 결과로 말합니다.'},
  ESFJ:{n:'집정관', k:['친화','협력','따뜻함'], d:'사람들 사이의 조화를 중요하게 여기는 타입. 모두가 함께 즐겁게 지내도록 애씁니다.'},
  ISTP:{n:'장인', k:['실용','침착','손재주'], d:'원리를 몸으로 익히는 실용형. 위기 상황에서 차분하게 해결책을 찾아냅니다.'},
  ISFP:{n:'모험가', k:['감성','자유','온화'], d:'조용하지만 자기 감각을 소중히 여기는 타입. 아름다운 것과 자유로운 순간을 사랑합니다.'},
  ESTP:{n:'사업가', k:['행동력','현실감각','승부'], d:'지금 이 순간에 집중해 빠르게 움직이는 타입. 기회를 잡는 감각이 뛰어납니다.'},
  ESFP:{n:'연예인', k:['유쾌','즉흥','사교'], d:'사람들과 함께 있을 때 가장 빛나는 타입. 즐거움을 나누고 분위기를 살립니다.'}
};
const DIM_NAMES = {
  EI:['E 외향','I 내향'], SN:['S 감각','N 직관'], TF:['T 사고','F 감정'], JP:['J 판단','P 인식']
};

let idx = 0;
const answers = new Array(QUESTIONS.length).fill(null);

const $ = id => document.getElementById(id);
function show(id) {
  ['intro','quiz','result'].forEach(x => $(x).classList.toggle('hidden', x !== id));
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function renderQ() {
  const q = QUESTIONS[idx];
  $('cnt').textContent = (idx + 1) + ' / ' + QUESTIONS.length;
  $('bar').style.width = (idx / QUESTIONS.length * 100) + '%';
  $('qText').textContent = q.t;
  $('prevBtn').style.visibility = idx === 0 ? 'hidden' : 'visible';
  document.querySelectorAll('#scale button').forEach(b => {
    b.classList.toggle('on', Number(b.dataset.v) === answers[idx]);
  });
}
$('startBtn').addEventListener('click', () => { idx = 0; show('quiz'); renderQ(); });
document.querySelectorAll('#scale button').forEach(b => {
  b.addEventListener('click', () => {
    answers[idx] = Number(b.dataset.v);
    if (idx < QUESTIONS.length - 1) { idx++; renderQ(); }
    else { finish(); }
  });
});
$('prevBtn').addEventListener('click', () => { if (idx > 0) { idx--; renderQ(); } });
$('retryBtn').addEventListener('click', () => { answers.fill(null); show('intro'); });

function finish() {
  // 차원별 점수: 첫 글자 쪽 문항은 그대로, 반대 쪽 문항은 (6 - 점수)
  const sum = {EI:0, SN:0, TF:0, JP:0};
  QUESTIONS.forEach((q, i) => {
    const v = answers[i];
    sum[q.d] += (q.l === q.d[0]) ? v : 6 - v;
  });
  // 차원당 문항 3개 → 합 범위 3~15, 기준 9. 9 이상이면 첫 글자, 미만이면 둘째 글자
  const pick = {};
  const pct = {};
  for (const d of Object.keys(sum)) {
    pick[d] = sum[d] >= 9 ? d[0] : d[1];
    pct[d] = Math.round((sum[d] - 3) / 12 * 100); // 0 = 둘째 글자 쪽, 100 = 첫 글자 쪽
  }
  const code = pick.EI + pick.SN + pick.TF + pick.JP;
  const t = TYPES[code];
  $('bar').style.width = '100%';
  $('rType').textContent = code;
  $('rNick').textContent = t.n;
  $('rKw').innerHTML = t.k.map(k => `<span class="tag">${k}</span>`).join('');
  $('rDesc').textContent = t.d;
  $('rAxes').innerHTML = Object.keys(DIM_NAMES).map(d => {
    const [a, b] = DIM_NAMES[d];
    return `<div class="axis"><span>${a.split(' ')[0]}</span>
      <div class="track"><div class="mid"></div><div class="dot" style="left:${100 - pct[d]}%"></div></div>
      <span>${b.split(' ')[0]}</span></div>`;
  }).join('');
  show('result');
}
</script>
</body>
</html>
